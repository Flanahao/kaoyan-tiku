<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>政治知识导图 - 考研题库</title>
  <link rel="stylesheet" href="css/politics.css">
</head>
<body class="politics-page">
  <div class="politics-shell">
    <main class="politics-canvas-stage">
      <div id="politicsGraph"></div>
    </main>

    <div class="politics-floating-left">
      <a class="politics-back" href="index.html">← 题库</a>
      <span class="politics-mode-badge">导图</span>
    </div>

    <div class="politics-floating-right">
      <button
        id="btnPoliticsRelations"
        class="politics-pill is-active"
        type="button"
        aria-pressed="true"
      >
        关联线：开
      </button>
      <button id="btnPoliticsFit" class="politics-pill" type="button">
        适应内容 F
      </button>
      <button id="btnPoliticsReset" class="politics-pill" type="button">
        复位 0
      </button>
    </div>

    <aside
      id="politicsInspector"
      class="politics-inspector"
      aria-live="polite"
    ></aside>

    <div class="politics-zoom-panel">
      <button
        id="btnPoliticsZoomOut"
        class="politics-icon-btn"
        type="button"
      >
        −
      </button>

      <input
        id="politicsZoomRange"
        type="range"
        min="18"
        max="180"
        value="72"
        aria-label="缩放"
      >

      <button
        id="btnPoliticsZoomIn"
        class="politics-icon-btn"
        type="button"
      >
        ＋
      </button>

      <span id="politicsZoomText">72%</span>
    </div>

    <div class="politics-canvas-hint">
      <strong id="politicsVisibleCount">加载中…</strong>
      <span>拖动画布 · 滚轮缩放 · 双击或 ± 展开</span>
    </div>

    <div
      id="politicsErrorBanner"
      class="politics-error-banner"
      hidden
    ></div>
  </div>

  <!--
    V1.1 不再加载 G6。
    lib/g6 文件保留，不删除。
  -->

  <script src="js/politics/config.js"></script>
  <script src="js/politics/data-loader.js"></script>
  <script src="js/politics/data-validator.js"></script>
  <script src="js/politics/store.js"></script>
  <script src="js/politics/projection.js"></script>
  <script src="js/politics/layout.js"></script>
  <script src="js/politics/graph.js"></script>
  <script src="js/politics/app.js"></script>
</body>
</html>
